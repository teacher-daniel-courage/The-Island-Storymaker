<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Play a story · Path.er</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/player.css">
</head>
<body class="play-page">
  <header class="site-header">
    <a class="btn back-btn" href="index.html"><span aria-hidden="true">←</span> Back to start</a>
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.6"/><circle cx="5" cy="19" r="2.6"/><circle cx="12" cy="19" r="2.6"/><circle cx="19" cy="19" r="2.6"/><path d="M12 7.5v9M12 10l-6.2 6.8M12 10l6.2 6.8" fill="none" stroke-width="1.8"/></svg>
      </span>
      Path.er
    </a>
    <div id="gameControls" class="header-actions" hidden>
      <button type="button" id="restartBtn" class="btn">Restart</button>
      <button type="button" id="otherStoryBtn" class="btn">Open another story</button>
    </div>
  </header>

  <main>
    <section id="picker" class="picker" aria-labelledby="pickerTitle">
      <div id="dropzone" class="dropzone">
        <svg class="dropzone-icon" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M13 5h15l11 11v25a3 3 0 0 1-3 3H13a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3z"/>
          <path d="M28 5v11h11"/>
          <path d="M24 36V23m-5.5 5.5L24 23l5.5 5.5"/>
        </svg>
        <h1 id="pickerTitle">Play a story</h1>
        <p class="dropzone-text">Drop a story file here, or choose one from your computer.</p>
        <button type="button" id="chooseBtn" class="btn btn-primary btn-large">Choose a story file</button>
        <p id="pickerError" class="picker-error" role="alert" hidden></p>
      </div>
      <p class="picker-hint">
        Story files end in <code>.story.json</code>. Make one in the <a href="storymaker.html">Storymaker</a> with <b>File → Export story file</b>.
        No story yet? <button type="button" id="sampleBtn" class="link-btn">Play <cite>The Cast Away</cite></button>
      </p>
    </section>

    <section id="game" class="game" aria-label="Game" hidden>
      <div class="ip-page">
        <h1 id="gameTitle" class="ip-site-title" tabindex="-1"></h1>
        <div id="playerRoot" class="ip-stage"></div>
      </div>
    </section>
  </main>

  <div id="dropOverlay" class="drop-overlay" hidden>
    <p>Drop to play this story</p>
  </div>
  <input type="file" id="fileInput" accept=".json,application/json" hidden>

  <script src="js/sample-story.js"></script>
  <script src="js/player.js"></script>
  <script src="js/play.js"></script>
</body>
</html>
